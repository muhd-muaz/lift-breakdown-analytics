name: Build demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas pytest
      - name: Generate synthetic data
        run: python generate_fake_data.py
      - name: Build dashboard
        working-directory: src
        run: python build_html.py
      - name: Tests
        run: pytest -q tests
      - name: Collect site
        run: |
          mkdir -p _site/docs _site/month-end
          cp "Breakdown Dashboard.html" index.html _site/
          cp docs/*.png _site/docs/
          cp month-end/*.pdf _site/month-end/
      - uses: actions/upload-pages-artifact@v5
        if: vars.DEPLOY_PAGES == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
