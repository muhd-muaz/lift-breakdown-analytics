<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Lifts Breakdown Dashboard</title>
<style>
:root{--ink:#1F2933;--muted:#6B7680;--line:#E3E7EB;--surface:#FFFFFF;--page:#F5F7F9;--p:#2F5D8C;--s:#9DB4CC;--n:#C9D1D9;--acc:#C0392B;--hover:#F0F3F6}
@media (prefers-color-scheme:dark){:root{--ink:#E6EAEE;--muted:#9AA5B1;--line:#2C343C;--surface:#1A2026;--page:#11161B;--p:#6E9BCB;--s:#3F5A75;--n:#3A434C;--hover:#222A31}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:13px/1.45 "Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:16px 24px 8px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
h1{font-size:22px;font-weight:600;margin:0}
.meta{color:var(--muted);font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--page);padding:8px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.bar label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:220px}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:var(--hover)}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 24px 0}
nav button{border:none;background:none;padding:8px 10px;border-bottom:2px solid transparent;border-radius:0;color:var(--muted)}
nav button.on{color:var(--ink);border-bottom-color:var(--p);font-weight:600}
main{padding:16px 24px 40px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.card .l{color:var(--muted);font-size:12px}
.card .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.card .s{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.bad{color:var(--acc)!important}
h2{font-size:15px;font-weight:600;margin:0 0 8px}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.tw{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-weight:600;cursor:pointer;user-select:none;font-size:12px}
td.n,th.n{text-align:right}
tr:hover td{background:var(--hover)}
td.wrap{white-space:normal;min-width:220px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.hide{display:none}
/* polish: shared by all tabs; .ov = Overview-only layout */
h1,h2{text-wrap:balance}
nav{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
nav button{white-space:nowrap}
.ov .grp{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}
.ov .cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.card{display:flex;flex-direction:column;gap:4px;min-height:112px}
.card .l{font-size:13px;color:var(--ink);font-weight:600}
.card .v{font-size:28px;line-height:1.1;margin:4px 0 0}
.card .s{text-wrap:pretty}
.panel svg{max-width:none}
.ov .basis{color:var(--muted);font-size:12px;margin:16px 0 0;text-wrap:pretty}
/* iOS-style look: grouped grey page, frosted filter bar, segmented tabs, borderless rounded cards */
:root{--page:#F2F2F7;--fill:rgba(118,118,128,.12);--seg:#FFFFFF;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);--glass:rgba(242,242,247,.8)}
@media (prefers-color-scheme:dark){:root{--page:#000000;--surface:#1C1C1E;--line:#38383A;--hover:#2C2C2E;--fill:rgba(118,118,128,.24);--seg:#636366;--shadow:none;--glass:rgba(0,0,0,.7)}}
body{font-family:-apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
header{padding-top:24px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.bar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:transparent;box-shadow:0 .5px 0 var(--line)}
.bar select,.bar button{background-color:var(--fill);border:none;border-radius:10px;padding:6px 10px}
.bar button{color:var(--p);font-weight:600}
nav{margin:12px 24px 0;padding:2px;gap:2px;background:var(--fill);border-radius:10px;width:fit-content;max-width:calc(100% - 48px)}
nav button{border:none;border-radius:8px;padding:6px 14px;color:var(--ink);transition:background-color .2s ease-out}
nav button.on{background:var(--seg);border:none;box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav button:active,.bar button:active{scale:.96}
.ov .grp{font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:8px 0 12px}
.card,.panel{border:none;border-radius:16px;box-shadow:var(--shadow);padding:20px}
.card .l{font-weight:600;color:var(--muted)}
.card .v{font-size:34px;font-weight:700;letter-spacing:-.02em}
/* calmer Overview: filters folded away, 4 hero tiles with trend, one strip for the rest */
header{justify-content:space-between;align-items:center}
.meta{margin-top:4px}
.fbtn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;background:var(--fill);border-radius:999px;padding:4px 10px;font-size:12px;margin-left:4px}
#ftog{background:var(--p);color:#fff;border:none;border-radius:999px;padding:7px 16px;font-weight:600;transition:scale .15s ease-out}
#ftog:active{scale:.96}
.bar.closed{display:none}
.ov .hero{min-height:0;gap:2px}
.ov .hero .v{font-size:40px;margin:4px 0 0}
.ov .spark{width:100%;height:56px;margin:12px 0 4px}
.ech{width:100%;height:360px}
.ov .hero .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ov .strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin:0 0 24px;padding:4px 0}
.ov .strip>div{padding:12px 20px;display:flex;flex-direction:column;gap:2px}
.ov .strip>div+div{border-left:1px solid var(--line)}
.ov .strip .l{font-size:12px;color:var(--muted)}
.ov .strip b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.ov .basis summary{cursor:pointer;color:var(--p);font-weight:600;width:fit-content}
/* tables and tools inside rounded panels */
.cards{gap:16px;margin-bottom:24px}
.panel h2{font-size:17px;letter-spacing:-.01em;margin-bottom:12px}
.panel .tw{border:none;border-radius:0}
th{color:var(--muted);font-weight:600}
th,td{padding:8px 10px}
.tools input,.tools button{background:var(--fill);border:none;border-radius:10px;padding:6px 12px}
.tools button{color:var(--p);font-weight:600}
.tools button:active{scale:.96}
@media (max-width:720px){
  .ov .strip{grid-template-columns:1fr 1fr}
  .ov .strip>div:nth-child(3){border-left:none}
  .ov .strip>div:nth-child(n+3){border-top:1px solid var(--line)}
  .ov .hero .v{font-size:30px}
  .chip{display:none}
  nav{margin:12px 16px 0;max-width:calc(100% - 32px)}
  header,.bar,main{padding-left:16px;padding-right:16px}
  .bar{position:static;display:grid;grid-template-columns:1fr 1fr}
  select,input{max-width:none;width:100%}
  .g2{grid-template-columns:1fr}
  .cards,.ov .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{min-height:96px;padding:12px}
  .card .v{font-size:24px}
  .ech{height:300px}
}
</style>
</head>
<body>
<header><div><h1>Breakdown dashboard</h1><div class="meta" id="meta"></div></div><div class="fbtn"><span id="chips"></span><button id="ftog" onclick="$('#bar').classList.toggle('closed')">Filters</button></div></header>
<div class="bar closed" id="bar"></div>
<nav id="tabs"></nav>
<main id="main"></main>
<script>/*__ECHARTS__*/</script>
<script>
const D=/*__DATA__*/null;
const T=D.dict, C=D.cb, N=C.id.length, $=s=>document.querySelector(s);
const fmt=(v,d=0)=>v==null||isNaN(v)?"–":Number(v).toLocaleString("en-MY",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>v==null||isNaN(v)?"–":(v*100).toFixed(1)+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const q90=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length?a[Math.min(a.length-1,Math.floor(.9*(a.length-1)))]:null};
const val=(f,i)=>T[f][C[f][i]];
const TGT=D.meta.target_mantrap;

// ---------- filters ----------
const F=[["fy","Financial year"],["mk","Month"],["zone","BU / zone"],["state","State"],["sector","Sector"],["ltype","Lift type"],["eng","Engineer"],["bt","Actual / non-actual"]];
const S={};
function buildBar(){
  let h="";
  for(const [f,l] of F){const opts=T[f].map((v,i)=>[v,i]).filter(x=>x[0]!=="").sort((a,b)=>a[0].localeCompare(b[0]));
    h+=`<label>${l}<select data-f="${f}"><option value="">All</option>${opts.map(([v])=>`<option>${esc(v)}</option>`).join("")}</select></label>`}
  h+=`<button id="reset">Reset</button>`;$("#bar").innerHTML=h;
  $("#bar").querySelectorAll("select").forEach(s=>s.onchange=()=>{S[s.dataset.f]=s.value;render()});
  $("#reset").onclick=()=>{for(const k in S)delete S[k];$("#bar").querySelectorAll("select").forEach(s=>s.value=s.dataset.f==="fy"?defFY:"");S.fy=defFY;render()};
}
const defFY=T.fy.includes("FY2026")?"FY2026":T.fy[T.fy.length-1];
function rows(skip=[]){const out=[];const act=Object.entries(S).filter(([k,v])=>v&&!k.startsWith("__")&&!skip.includes(k));
  const codes=act.map(([k,v])=>[k,T[k].indexOf(v)]);
  for(let i=0;i<N;i++){let ok=true;for(const [k,c] of codes)if(C[k][i]!==c){ok=false;break}if(ok)out.push(i)}return out}
function group(idx,key){const m=new Map();for(const i of idx){const k=key(i);if(!m.has(k))m.set(k,[]);m.get(k).push(i)}return m}
const sum=(idx,f)=>idx.reduce((a,i)=>a+(C[f][i]||0),0);
const isAct=i=>val("bt",i)==="Actual";
function kpis(idx){const lifts=group(idx.filter(i=>val("lift",i)!==""),i=>C.lift[i]);let over=0;for(const [,a] of lifts)if(a.filter(isAct).length>2)over++;
  const resp=idx.map(i=>C.resp[i]);const w=idx.filter(i=>C.win[i]!=null);
  return{n:idx.length,act:idx.filter(isAct).length,non:idx.filter(i=>val("bt",i)==="Non-actual").length,man:sum(idx,"man"),
    over,lifts:lifts.size,r30:sum(idx,"r30"),r7:sum(idx,"r7"),med:med(resp),p90:q90(resp),win:w.length?sum(w,"win")/w.length:null,
    ev:w.length,matched:sum(idx,"m"),rep:med(idx.map(i=>C.rep[i]))}}
function pmAgg(){const P=D.pm,act=Object.entries(S).filter(([k,v])=>v&&["fy","mk","zone","state","sector","ltype","eng"].includes(k));
  const out=[];for(let i=0;i<P.due.length;i++){let ok=true;for(const [k,v] of act){if(T[k+"_pm"][P[k][i]]!==v){ok=false;break}}if(ok)out.push(i)}return out}

// ---------- rendering helpers ----------
function table(cols,data,{id="t",search=false,csv=true,sort=null,limit=null}={}){
  const tid="tb_"+id;let h=`<div class="tools">`;
  if(search)h+=`<input placeholder="Search…" oninput="filt('${tid}',this.value)">`;
  if(csv)h+=`<button onclick="csv('${tid}')">Export CSV</button>`;
  h+=`<span class="note">${data.length.toLocaleString()} rows</span></div><div class="tw"><table id="${tid}"><thead><tr>`;
  cols.forEach((c,j)=>h+=`<th class="${c.n?"n":""}" onclick="srt('${tid}',${j},${!!c.n})">${esc(c.h)}</th>`);h+="</tr></thead><tbody>";
  let d=data;if(sort!=null)d=[...d].sort((a,b)=>(b[sort]??-1e18)-(a[sort]??-1e18));if(limit)d=d.slice(0,limit);
  for(const r of d){h+="<tr>";cols.forEach((c,j)=>{const v=r[j];const cls=[c.n?"n":"",c.wrap?"wrap":"",c.bad&&c.bad(v,r)?"bad":""].join(" ");
    h+=`<td class="${cls}" data-v="${v??""}">${c.f?c.f(v,r):esc(v)}</td>`});h+="</tr>"}
  return h+"</tbody></table></div>"}
window.srt=(tid,j,isn)=>{const t=document.getElementById(tid),b=t.tBodies[0],r=[...b.rows],dir=t.dataset.s==j?-(+t.dataset.d||1):-1;
  r.sort((x,y)=>{let a=x.cells[j].dataset.v,c=y.cells[j].dataset.v;if(isn){a=a===""?-1e18:+a;c=c===""?-1e18:+c;return(a-c)*-dir}return a.localeCompare(c)*-dir});
  r.forEach(x=>b.appendChild(x));t.dataset.s=j;t.dataset.d=dir};
window.filt=(tid,q)=>{q=q.toLowerCase();for(const r of document.getElementById(tid).tBodies[0].rows)r.classList.toggle("hide",!r.textContent.toLowerCase().includes(q))};
window.csv=tid=>{const t=document.getElementById(tid);const L=[...t.rows].filter(r=>!r.classList.contains("hide")).map(r=>[...r.cells].map(c=>`"${c.textContent.replace(/"/g,'""')}"`).join(","));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+L.join("\n")],{type:"text/csv"}));a.download=tid+".csv";a.click()};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],monLab=m=>MON[+m.slice(5,7)-1]+" "+m.slice(2,4);
const card=(l,v,s="",bad=false)=>`<div class="card"><div class="l">${l}</div><div class="v ${bad?"bad":""}">${v}</div><div class="s">${s}</div></div>`;
let CH=[];const AFTER=[],cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function ec(id,opt){const el=document.getElementById(id);if(!el||!window.echarts)return;const c=echarts.init(el);
  c.setOption({animationDuration:700,textStyle:{fontFamily:getComputedStyle(document.body).fontFamily},
    tooltip:{backgroundColor:cssv("--surface"),borderColor:cssv("--line"),textStyle:{color:cssv("--ink")},extraCssText:"border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12)"},...opt});CH.push(c)}
window.addEventListener("resize",()=>CH.forEach(c=>c.resize()));
function spark(id,labels,vals,f){AFTER.push(()=>ec(id,{grid:{left:4,right:8,top:8,bottom:4},
  tooltip:{trigger:"axis",formatter:p=>`${p[0].name}: <b>${p[0].value==null?"–":f(p[0].value)}</b>`},
  xAxis:{type:"category",show:false,boundaryGap:false,data:labels},yAxis:{type:"value",show:false,scale:true},
  series:[{type:"line",data:vals,smooth:.35,showSymbol:false,symbolSize:7,connectNulls:true,lineStyle:{width:2.5,color:cssv("--p")},itemStyle:{color:cssv("--p")},
    areaStyle:{color:cssv("--p"),opacity:.12},endLabel:{show:false}}]}));return `<div class="spark" id="${id}"></div>`}
function monthChart(id,labels,series,line=null){// series [[name,cssVar,vals]] stacked; rounded top + total on the top non-zero segment; line {name,vals,f} on its own right axis
  const tot=labels.map((_,i)=>series.reduce((t,x)=>t+(x[2][i]||0),0)),top=labels.map((_,i)=>series.reduce((k,x,j)=>x[2][i]?j:k,-1));
  AFTER.push(()=>ec(id,{grid:{left:4,right:4,top:44,bottom:4,containLabel:true},
    legend:{top:0,left:0,icon:"roundRect",itemWidth:12,itemHeight:12,itemGap:16,textStyle:{color:cssv("--muted")}},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow",shadowStyle:{color:"rgba(128,128,128,.10)"}},
      formatter:p=>`<b>${p[0].name}</b> · ${fmt(tot[p[0].dataIndex])}<br>`+p.map(x=>`${x.marker}${x.seriesName}: ${x.value==null?"–":x.seriesType==="line"?line.f(x.value):fmt(x.value)}`).join("<br>")},
    xAxis:{type:"category",data:labels,axisTick:{show:false},axisLine:{lineStyle:{color:cssv("--line")}},axisLabel:{color:cssv("--muted")}},
    yAxis:[{type:"value",splitLine:{lineStyle:{color:cssv("--line"),type:[3,5]}},axisLabel:{color:cssv("--muted"),formatter:v=>fmt(v)}},
      {type:"value",show:!!line,splitLine:{show:false},axisLabel:{color:cssv("--muted"),formatter:v=>line?line.f(v):v}}],
    series:series.map(([n,c,v],j)=>({name:n,type:"bar",stack:"t",barMaxWidth:48,emphasis:{focus:"series"},itemStyle:{color:cssv(c)},
      data:v.map((x,i)=>top[i]===j?{value:x,itemStyle:{borderRadius:[8,8,0,0]},label:{show:true,position:"top",formatter:()=>fmt(tot[i]),color:cssv("--ink"),fontWeight:600}}:x)})).concat(line?[{name:line.name,type:"line",yAxisIndex:1,data:line.vals,smooth:.3,connectNulls:true,symbolSize:6,
        lineStyle:{width:2.5,color:cssv("--ink")},itemStyle:{color:cssv("--ink")},
        markLine:line.target==null?undefined:{symbol:"none",silent:true,lineStyle:{color:cssv("--acc"),type:"dashed"},label:{position:"insideEndTop",color:cssv("--acc"),formatter:`Target ${line.f(line.target)}`},data:[{yAxis:line.target}]}}]:[])}));
  return `<div class="ech" id="${id}"></div>`}
function hbar(id,items){// items [label,value], largest first; drawn top-down
  AFTER.push(()=>ec(id,{grid:{left:4,right:48,top:4,bottom:4,containLabel:true},tooltip:{trigger:"axis",axisPointer:{type:"shadow",shadowStyle:{color:"rgba(128,128,128,.10)"}},valueFormatter:v=>fmt(v)},
    xAxis:{type:"value",show:false},yAxis:{type:"category",inverse:true,data:items.map(x=>String(x[0]).slice(0,34)),axisTick:{show:false},axisLine:{show:false},axisLabel:{color:cssv("--muted")}},
    series:[{type:"bar",data:items.map(x=>x[1]),barMaxWidth:16,itemStyle:{color:cssv("--p"),borderRadius:[0,6,6,0]},label:{show:true,position:"right",color:cssv("--ink"),formatter:p=>fmt(p.value)}}]}));
  return `<div class="ech" id="${id}" style="height:${items.length*26+16}px"></div>`}
function delta(cur,prev,fy,rate,upGood){if(cur==null||prev==null||!prev)return "&nbsp;";// rate: change in points; else % change
  const d=rate?(cur-prev)*100:(cur/prev-1)*100,worse=upGood?d<0:d>0;
  return `<span class="${worse?"bad":""}">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(1)}${rate?" pts":"%"}</span> vs ${esc(fy)}`}
function prevFY(ms){// same filters, previous FY, same months of the year only (fair for a part year)
  if(!S.fy)return null;const fy="FY"+(+S.fy.slice(2)-1);if(!T.fy.includes(fy))return null;
  const keep={fy:S.fy,mk:S.mk},mm=new Set(ms.map(m=>m.slice(5)));S.fy=fy;if(S.mk)S.mk=(+S.mk.slice(0,4)-1)+S.mk.slice(4);
  let r=[],p=[];if(!S.mk||T.mk.includes(S.mk)){r=rows().filter(i=>mm.has(val("mk",i).slice(5)));p=pmAgg().filter(i=>mm.has(T.mk_pm[D.pm.mk[i]].slice(5)))}
  S.fy=keep.fy;if(keep.mk)S.mk=keep.mk;else delete S.mk;
  return r.length?{fy,k:kpis(r),due:p.reduce((a,i)=>a+D.pm.due[i],0),done:p.reduce((a,i)=>a+D.pm.done[i],0)}:null}
const months=idx=>[...new Set(idx.map(i=>val("mk",i)))].filter(Boolean).sort();
const basis=`FY = Oct–Sep, by ERP Created date. Non-actual = ${D.meta.nonactual}. Attend target ${D.meta.target_mantrap} min (non-mantrap provisional). Fault code = ERP, else predicted from remarks.`;

// ---------- pages ----------
const P={
Overview(){const idx=rows(),k=kpis(idx),pm=pmAgg(),due=pm.reduce((a,i)=>a+D.pm.due[i],0),done=pm.reduce((a,i)=>a+D.pm.done[i],0),ms=months(idx);
  const by=group(idx,i=>val("mk",i));const mv=t=>ms.map(m=>(by.get(m)||[]).filter(i=>val("bt",i)===t).length);
  const pmBy=new Map();pm.forEach(i=>{const m=T.mk_pm[D.pm.mk[i]],o=pmBy.get(m)||[0,0];o[0]+=D.pm.due[i];o[1]+=D.pm.done[i];pmBy.set(m,o)});
  const pms=[...pmBy.keys()].sort(),winM=ms.map(m=>{const a=(by.get(m)||[]).filter(i=>C.win[i]!=null);return a.length?sum(a,"win")/a.length:null});
  const ml=ms.map(monLab),pv=prevFY(ms),pdone=pv&&pv.due?pv.done/pv.due:null,pmr=due?done/due:null;
  const hero=(l,v,sub,trend,dl,bad)=>`<div class="card hero"><div class="l">${l}</div><div class="v ${bad?"bad":""}">${v}</div><div class="s">${sub}</div>${trend}<div class="d">${dl}</div></div>`;
  const mini=(l,v,bad)=>`<div><span class="l">${l}</span><b class="${bad?"bad":""}">${v}</b></div>`;
  return `<div class="ov"><div class="cards">

"Mantrap follow-up"(){const idx=rows().filter(i=>C.man[i]),BADM=1440,ok=i=>C.resp[i]!=null&&C.resp[i]<=BADM;// > 1 day = likely wrong CallDesk match
